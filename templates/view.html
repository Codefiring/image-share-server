<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Image</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Share</h1>
            <nav>
                <a href="/">Upload</a>
                <a href="/gallery">Gallery</a>
                <a href="/manage">My Images</a>
            </nav>
        </header>

        <main>
            <div class="view-image">
                <img src="{{ url_for('uploaded_file', filename=image.filename) }}" alt="Shared Image">
                <div class="image-meta">
                    <p>Uploaded: {{ image.upload_time }}</p>
                    {% if image.one_time %}
                    <p class="warning">⚠️ This is a one-time link. It will expire after this view.</p>
                    {% endif %}
                </div>
            </div>
        </main>
    </div>
</body>
</html>
